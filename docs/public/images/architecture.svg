<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Consolas, Menlo, monospace">
  <rect width="680" height="360" rx="12" fill="#0d1117"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <g font-size="15" fill="#e6edf3" text-anchor="middle">
    <rect x="40" y="150" width="120" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="100" y="176">浏览器</text>
    <text x="100" y="196" font-size="11" fill="#768390">客户端</text>

    <rect x="280" y="150" width="120" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="340" y="176">CDN</text>
    <text x="340" y="196" font-size="11" fill="#768390">缓存加速</text>

    <rect x="520" y="150" width="120" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="580" y="176">GitHub Pages</text>
    <text x="580" y="196" font-size="11" fill="#768390">静态站点</text>

    <rect x="280" y="40" width="120" height="56" rx="10" fill="#161b22" stroke="#3fb950"/>
    <text x="340" y="64" fill="#3fb950">git 仓库</text>
    <text x="340" y="82" font-size="11" fill="#768390">内容源</text>
  </g>

  <g stroke="#58a6ff" stroke-width="2" fill="none">
    <line x1="160" y1="180" x2="276" y2="180" marker-end="url(#arr)"/>
    <line x1="400" y1="180" x2="516" y2="180" marker-end="url(#arr)"/>
    <path d="M340 96 L340 146" marker-end="url(#arr)"/>
  </g>

  <text x="340" y="330" font-size="12" fill="#768390" text-anchor="middle">一次 HTTP 请求：浏览器 → CDN → GitHub Pages</text>
</svg>
